<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Counting Pairs — CuriousLab</title>
<meta name="description" content="A text-free counting, addition and subtraction game for preschool children.">
<meta name="theme-color" content="#eaf4f7">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="game.css">
</head>
<body>
<!-- Two views, swapped rather than navigated: the map and the board share a
     document so a deep link, ?unlock and the loaded sprite sheet all survive
     moving between them. `hidden` is in the static markup so the board never
     flashes before main.js decides which view to show. -->
<main class="stage map-view">
	<div class="map-hud"></div>
	<div class="map-host"></div>
</main>
<main class="stage play-view" hidden>
	<div class="hud"></div>
	<div class="board"></div>
	<div class="garden"></div>
</main>
<noscript>
	<p style="padding:1rem;font:16px system-ui">This game needs JavaScript enabled.</p>
</noscript>
<script type="module" src="main.js"></script>
</body>
</html>
